name: Reset gh-pages to working state

on:
  workflow_dispatch:

jobs:
  reset:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Force reset gh-pages to last working commit (7174c74)
        run: |
          git push origin 7174c74402fca0dfde033c82273d96bfb8a66eae:refs/heads/gh-pages --force
